name: PRKE offline regression (synthetic only)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base + PDF test dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline tests, synthetic fixtures only
        run: python -m unittest discover -s tests -v
      - name: Deterministic capability/semantic/critic doctors
        run: |
          python scripts/router_cli.py doctor
          python scripts/execution_core.py doctor
          python scripts/scientific_semantics.py doctor
          python scripts/review_gate.py doctor
